name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - name: Test (macOS)
        run: swift test
      - name: Build (iOS Simulator)
        run: xcodebuild -scheme WearableRecorder-Package -destination 'generic/platform=iOS Simulator' -skipMacroValidation build
